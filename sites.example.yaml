# Copia in sites.yaml. Le credenziali NON vanno qui: usa le variabili d'ambiente
# PORTALFETCH_<SITO>_USER e PORTALFETCH_<SITO>_PASSWORD (vedi .env.example).
download_dir: downloads
tracking_file: state/tracking.json
browser: chromium        # chromium | msedge | auto (Edge se presente, utile su Windows)
headless: true

sites:
  # 1) Portale descritto solo con selettori CSS: nessun codice da scrivere
  demo:
    type: generic
    url: http://127.0.0.1:8765/login
    selectors:
      user: "#user"
      password: "#password"
      submit: "#submit"
      logged_in: "#area"       # elemento visibile solo dopo il login
      error: ".error"          # messaggio di credenziali errate (opzionale)
      links: "a.inv"           # link ai documenti
      next: "#next"            # paginazione (opzionale)

  # 2) Plugin scritto in Python (portalfetch/portals/demo_api.py): elenco da API JSON
  demo_api:
    type: demo_api
    url: http://127.0.0.1:8765/login
    api_path: /api/invoices
    selectors:
      user: "#user"
      password: "#password"
      submit: "#submit"
      logged_in: "#area"
      links: "a.inv"
