[project]
name = "pinpick"
version = "0.1.0"
description = "Scarica foto a caso dalle tue bacheche Pinterest tramite l'API ufficiale"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3"]

[project.scripts]
pinpick = "pinpick.cli:main"

[tool.setuptools]
packages = ["pinpick", "pinpick.sources", "fake_pinterest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
