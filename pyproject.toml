[project]
name = "portalfetch"
version = "0.1.0"
description = "Motore a plugin per scaricare documenti da portali web (Playwright)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.45", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "flask>=3"]

[project.scripts]
portalfetch = "portalfetch.cli:main"

[tool.setuptools]
packages = ["portalfetch", "portalfetch.portals", "demo_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
